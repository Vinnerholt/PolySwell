# Builds PolySwell II for Windows and macOS on every push. Pushing a tag like v2.0.0 also publishes a GitHub Release
# with PolySwell-II-Windows.zip and PolySwell-II-macOS.zip (the download page links to the latest one).
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
          - os: macos-latest
            name: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -B build -A x64   # the image's default Visual Studio

      - name: Configure (macOS, universal arm64 + x86_64)
        if: runner.os == 'macOS'
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13

      - name: Build and run the DSP tests
        shell: bash
        run: |
          cmake --build build --config Release --target engine_test --parallel
          exe=$(find build -type f \( -name engine_test -o -name engine_test.exe \) | head -1)
          "$exe"

      - name: Build the plugin (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build --config Release --target PolySwell_VST3 --parallel

      - name: Build the plugin (macOS)
        if: runner.os == 'macOS'
        run: cmake --build build --config Release --target PolySwell_VST3 PolySwell_AU --parallel

      - name: Validate the Audio Unit (auval - the same check Logic runs at start)
        if: runner.os == 'macOS'
        run: |
          COMP="$HOME/Library/Audio/Plug-Ins/Components/PolySwell II.component"
          mkdir -p "$HOME/Library/Audio/Plug-Ins/Components"
          rm -rf "$COMP"
          cp -R "build/PolySwell_artefacts/Release/AU/PolySwell II.component" "$COMP"
          codesign --force --deep --sign - "$COMP"
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 2
          auval -a | grep -i "Psw2" || true
          TYPE=$(auval -a | awk '$2 == "Psw2" && $3 == "Ynam" { print $1; exit }')
          echo "Audio Unit type: ${TYPE:-not found}"
          test -n "$TYPE"
          auval -v "$TYPE" Psw2 Ynam

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/PolySwell-II | Out-Null
          Copy-Item -Recurse "build/PolySwell_artefacts/Release/VST3/PolySwell II.vst3" dist/PolySwell-II/
          Copy-Item packaging/INSTALL-Windows.txt dist/PolySwell-II/INSTALL.txt
          Copy-Item LICENSE dist/PolySwell-II/LICENSE.txt
          Compress-Archive -Path dist/PolySwell-II -DestinationPath PolySwell-II-Windows.zip

      - name: Package (macOS, ad-hoc signed)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/PolySwell-II
          cp -R "build/PolySwell_artefacts/Release/VST3/PolySwell II.vst3" dist/PolySwell-II/
          cp -R "build/PolySwell_artefacts/Release/AU/PolySwell II.component" dist/PolySwell-II/
          for b in dist/PolySwell-II/*.vst3 dist/PolySwell-II/*.component; do codesign --force --deep --sign - "$b"; done
          cp packaging/INSTALL-macOS.txt dist/PolySwell-II/INSTALL.txt
          cp packaging/install-mac.command dist/PolySwell-II/
          chmod +x dist/PolySwell-II/install-mac.command
          cp LICENSE dist/PolySwell-II/LICENSE.txt
          ditto -c -k --keepParent dist/PolySwell-II PolySwell-II-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PolySwell-II-${{ matrix.name }}
          path: PolySwell-II-${{ matrix.name }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            PolySwell-II-Windows.zip
            PolySwell-II-macOS.zip
          generate_release_notes: true
